<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Required</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1b1e; }
    .card { background: #26272b !important; color: #eee !important; }
    input { background: #1a1b1e !important; color: #eee !important; border-color: #444 !important; }
  }
  .card {
    background: #fff;
    padding: 2.5rem 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 1.25rem;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.65rem 0.75rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 0.75rem;
  }
  button {
    width: 100%;
    padding: 0.65rem 0.75rem;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .error {
    color: #dc2626;
    font-size: 0.875rem;
    min-height: 1.2em;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Enter password to continue</h1>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="pw" placeholder="Password" autofocus required>
      <button type="submit">Continue</button>
      <div class="error" id="err"></div>
    </form>
  </div>

<script>
  // ---- CONFIGURE THESE TWO VALUES ----
  const CORRECT_PASSWORD = "TroyAllen";
  const REDIRECT_URL = "https://sites.google.com/view/133rdacademyblet/home";
  // -------------------------------------

  document.getElementById("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    const entered = document.getElementById("pw").value;
    if (entered === CORRECT_PASSWORD) {
      window.location.href = REDIRECT_URL;
    } else {
      document.getElementById("err").textContent = "Incorrect password. Try again.";
      document.getElementById("pw").value = "";
      document.getElementById("pw").focus();
    }
  });
</script>
</body>
</html>
